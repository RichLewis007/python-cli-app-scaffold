[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "python-cli-app-scaffold"  # Change this to your package name
version = "0.1.0"
description = "A modern Python CLI utility scaffold"
readme = "README.md"
requires-python = ">=3.14"
license = {text = "MIT"}
authors = [
    {name = "Rich Lewis", email = "your.email@example.com"},
]
keywords = ["cli", "terminal", "utility"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.14",
]

dependencies = [
    "typer>=0.12.0",
    "rich>=13.0.0",  # Great for beautiful terminal output
]

[project.urls]
Homepage = "https://github.com/RichLewis007/python-cli-app-scaffold"
Repository = "https://github.com/RichLewis007/python-cli-app-scaffold"
Issues = "https://github.com/RichLewis007/python-cli-app-scaffold/issues"

# Optional dependencies for compatibility with other tools (pip, setuptools, etc.)
# Note: uv uses [dependency-groups] below instead, but this section is kept
# for compatibility with tools that don't yet support PEP 735 dependency groups
[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

# Entry point - command name can differ from package name
# Change 'mycli' to your desired command name
[project.scripts]
mycli = "python_cli_app_scaffold.main:app"

# Dependency groups (PEP 735) - used by uv for dependency management
# This is the modern standard that uv uses. The 'dev' group is special-cased
# in uv and is synced by default. This replaces the deprecated tool.uv.dev-dependencies.
[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
]

[tool.ruff]
target-version = "py314"
line-length = 100
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = []

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]

[tool.mypy]
python_version = "3.14"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --cov=python_cli_app_scaffold --cov-report=term-missing"
